<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14101f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="今夜も配信中">
  <title>今夜も配信中</title>
  <style>
    /* ===== 色（夜の配信部屋） ===== */
    :root {
      --bg: #f6f3fb;
      --card: #ffffff;
      --text: #231c2e;
      --muted: #85799a;
      --line: #e6def2;
      --accent: #ff3d7f;
      --accent-soft: #ffe1ec;
      --live: #ff2b4a;
      --violet: #7a5cff;
      --gold: #ffb020;
      --green: #19b37a;
      --red: #ef4444;
      --chat: #f1edf8;
      --shadow: 0 6px 20px rgba(122, 92, 255, .10);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14101f; --card: #1f1930; --text: #f3eefc; --muted: #9d91b4; --line: #342a4a;
        --accent-soft: #3a1c2c; --chat: #2a2240; --shadow: 0 6px 20px rgba(0, 0, 0, .35); color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #14101f; --card: #1f1930; --text: #f3eefc; --muted: #9d91b4; --line: #342a4a;
      --accent-soft: #3a1c2c; --chat: #2a2240; --shadow: 0 6px 20px rgba(0, 0, 0, .35); color-scheme: dark;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 15px; line-height: 1.6;
      padding-bottom: calc(110px + env(safe-area-inset-bottom));
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
    .hidden { display: none !important; }
    a { color: var(--violet); }

    header {
      position: sticky; top: 0; z-index: 5;
      background: linear-gradient(135deg, #2b1f4d, #6a2a6e 60%, #b0315e);
      color: #fff; padding: calc(10px + env(safe-area-inset-top)) 0 10px;
    }
    .head-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .logo { font-weight: 800; font-size: 18px; }
    .day-badge { background: rgba(255,255,255,.18); border-radius: 99px; padding: 2px 12px; font-weight: 700; font-size: 13px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .stat { background: rgba(255,255,255,.13); border-radius: 12px; padding: 4px 6px; text-align: center; }
    .stat b { display: block; font-size: 15px; line-height: 1.2; }
    .stat small { font-size: 10px; opacity: .85; }
    .bar { height: 4px; background: rgba(255,255,255,.25); border-radius: 4px; margin-top: 3px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: #fff; border-radius: 4px; transition: width .4s; }

    .tabs { display: flex; gap: 6px; margin: 12px 0; }
    .tab { position: relative; flex: 1; border: 0; background: var(--card); border-radius: 99px; padding: 8px 0; font-weight: 700; color: var(--muted); box-shadow: var(--shadow); }
    .tab.on { background: var(--text); color: var(--bg); }
    .badge { position: absolute; top: -4px; right: 6px; background: var(--live); color: #fff; border-radius: 99px; font-size: 11px; min-width: 18px; padding: 0 5px; line-height: 18px; }

    .card { background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
    .row { display: flex; gap: 10px; align-items: center; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; font-size: 24px; flex: none; }
    .name { font-weight: 800; }
    .sub { color: var(--muted); font-size: 12px; }
    .hint { font-size: 12px; color: var(--muted); }
    .note { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0; }
    .hearts { color: var(--accent); letter-spacing: 1px; font-size: 13px; }
    .stage { display: inline-block; font-size: 11px; font-weight: 800; padding: 0 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
    .love-bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .love-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff9ac0, var(--accent)); border-radius: 99px; transition: width .6s; }
    .log-item { font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
    .log-item:last-child { border-bottom: 0; }
    .log-item b { color: var(--muted); font-weight: 700; margin-right: 6px; }

    /* ===== アクションバー ===== */
    .actions {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
      background: var(--card); border-top: 1px solid var(--line);
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
    }
    .btn-row { display: flex; gap: 8px; }
    .btn { border: 0; border-radius: 14px; padding: 12px 14px; font-weight: 800; background: var(--accent-soft); color: var(--text); }
    .btn.main { flex: 1; background: linear-gradient(135deg, var(--live), #ff6aa0); color: #fff; }
    .btn.violet { background: linear-gradient(135deg, var(--violet), #b46bff); color: #fff; }
    .btn.danger { background: var(--red); color: #fff; }
    .btn.small { padding: 8px 12px; font-size: 13px; border-radius: 12px; }
    .btn:disabled { opacity: .45; }
    .btn.block { width: 100%; }

    label.f { display: block; font-weight: 700; font-size: 13px; margin: 12px 0 4px; }
    .in { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); outline: none; }
    .in:focus { border-color: var(--accent); }
    textarea.in { min-height: 70px; resize: vertical; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
    .chip.on { border-color: var(--accent); background: var(--accent); color: #fff; }
    .emoji-chip { font-size: 22px; padding: 2px 8px; }

    /* ===== シート ===== */
    .sheet-bg { position: fixed; inset: 0; background: rgba(15, 8, 25, .5); z-index: 30; display: flex; align-items: flex-end; }
    .sheet {
      width: 100%; max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 22px 22px 0 0;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 90vh; overflow-y: auto;
      animation: up .22s ease-out;
    }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } }
    .sheet h2 { margin: 0 0 6px; font-size: 18px; }
    .big-emoji { font-size: 52px; text-align: center; }
    .result-num { font-size: 32px; font-weight: 900; text-align: center; margin: 4px 0; }
    .up { color: var(--green); }
    .down { color: var(--red); }
    .story { white-space: pre-wrap; background: var(--chat); border-radius: 14px; padding: 12px; margin: 10px 0; }
    .choice { display: block; width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 12px; margin-top: 8px; font-weight: 600; }
    .choice:active { border-color: var(--accent); }

    /* ===== 配信画面 ===== */
    #live { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; }
    .live-top { background: #120c1e; color: #fff; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; }
    .live-flag { background: var(--live); color: #fff; font-weight: 900; border-radius: 6px; padding: 0 8px; font-size: 13px; animation: blink 1.6s infinite; }
    @keyframes blink { 50% { opacity: .55; } }
    .live-title { font-weight: 800; font-size: 14px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live-meta { display: flex; gap: 12px; font-size: 13px; opacity: .9; align-items: center; }
    .live-meta .end { margin-left: auto; background: rgba(255,255,255,.15); border: 0; color: #fff; border-radius: 10px; padding: 4px 10px; font-weight: 700; }
    .hype { height: 6px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .hype i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--live)); transition: width .8s; }
    #chat { flex: 1; overflow-y: auto; padding: 10px 16px; }
    .cm { padding: 6px 10px; border-radius: 12px; margin: 4px 0; background: var(--chat); font-size: 14px; animation: pop .25s ease-out; }
    @keyframes pop { from { transform: translateY(8px); opacity: 0; } }
    .cm .u { font-weight: 800; margin-right: 6px; color: var(--muted); }
    .cm.hero .u { color: var(--accent); }
    .cm.sc { background: linear-gradient(135deg, #ffcf4a, #ff8a3d); color: #3a1d00; }
    .cm.sc.big { background: linear-gradient(135deg, #ff4a6e, #c2185b); color: #fff; }
    .cm.sc .u { color: inherit; }
    .cm .yen { display: block; font-weight: 900; font-size: 12px; }
    .cm.me { background: var(--violet); color: #fff; margin-left: 24px; }
    .cm.me .u { color: #fff; }
    .cm.partner { background: var(--accent-soft); border: 1.5px solid var(--accent); }
    .cm.picked { outline: 2.5px solid var(--accent); }
    .cm.pickable { cursor: pointer; }
    .cm.sys { background: transparent; text-align: center; color: var(--muted); font-size: 12px; }
    .live-bottom { background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
    .pick-preview { font-size: 12px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pick-preview b { color: var(--accent); }
    .send-row { display: flex; gap: 6px; margin-top: 6px; }
    .send-row .in { flex: 1; }

    /* ===== DM ===== */
    .thread { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .thread:last-child { border-bottom: 0; }
    .thread .last { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--live); flex: none; }
    .bubbles { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
    .bub { max-width: 82%; padding: 8px 12px; border-radius: 16px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .bub.her { background: var(--chat); align-self: flex-start; border-bottom-left-radius: 4px; }
    .bub.me { background: var(--violet); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bub.sys { align-self: center; background: transparent; color: var(--muted); font-size: 12px; }

    .toast {
      position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 99px; z-index: 50;
      font-weight: 700; font-size: 13px; max-width: calc(100% - 32px); text-align: center;
    }
    .loading { text-align: center; padding: 24px 0; }
    .spinner { width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--accent-soft); border-top-color: var(--accent); margin: 0 auto 10px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .typing { color: var(--muted); font-size: 13px; padding: 6px 0; }
  </style>
</head>
<body>

<!-- ===== 最初の設定 ===== -->
<section id="setup" class="hidden">
  <header><div class="wrap"><div class="logo">🔴 今夜も配信中</div></div></header>
  <div class="wrap" style="padding-top:14px">
    <div class="card">
      <b>あそびかた</b>
      <p class="hint" style="margin:6px 0 0">
        あなたは駆け出しの配信者。配信ではリスナーのコメントを拾って、あなたの言葉で返そう。
        常連リスナー、先輩・後輩の配信者、そして謎の高額スパチャ…。DMやコラボで距離が縮まれば、その先の関係も――？
        30日で登録者を増やしつつ、恋の行方を見届けよう。
      </p>
    </div>

    <div class="card">
      <b>① GeminiのAPIキー（無料）</b>
      <p class="hint" style="margin:4px 0">
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> で発行して貼り付け。キーはこのスマホの中にだけ保存されます。
      </p>
      <input id="s-key" class="in" placeholder="AIza..." autocomplete="off">
    </div>

    <div class="card">
      <b>② あなた（配信者）のプロフィール</b>
      <label class="f">アイコン</label>
      <div class="chips" id="s-avatars"></div>
      <label class="f">配信者名</label>
      <input id="s-name" class="in" placeholder="例: ハル" maxlength="16">
      <label class="f">配信ジャンル</label>
      <div class="chips" id="s-genres"></div>
      <label class="f">あなたのキャラ・しゃべり方</label>
      <textarea id="s-persona" class="in" placeholder="例: 関西弁。ゆるいけどツッコミは鋭い。照れると早口になる"></textarea>
    </div>

    <button class="btn main block" id="s-start" style="margin-bottom:24px">配信者デビュー！</button>
    <p class="note"><a href="influencer.html">前のゲーム「バズれ！AIインフルエンサー」はこちら</a></p>
  </div>
</section>

<!-- ===== メイン画面 ===== -->
<section id="game" class="hidden">
  <header>
    <div class="wrap">
      <div class="head-row">
        <div class="logo" id="h-name"></div>
        <div class="day-badge" id="h-day"></div>
      </div>
      <div class="stats">
        <div class="stat"><b id="h-subs"></b><small>登録者</small></div>
        <div class="stat"><b id="h-energy"></b><small>体力</small><div class="bar"><i id="h-energy-bar"></i></div></div>
        <div class="stat"><b id="h-money"></b><small>スパチャ収益</small></div>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="tabs">
      <button class="tab on" data-tab="home">ホーム</button>
      <button class="tab" data-tab="dm">DM<span class="badge hidden" id="dm-badge"></span></button>
      <button class="tab" data-tab="hearts">関係</button>
      <button class="tab" data-tab="me">自分</button>
    </div>
    <div id="v-home"></div>
    <div id="v-dm" class="hidden"></div>
    <div id="v-hearts" class="hidden"></div>
    <div id="v-me" class="hidden"></div>
  </div>

  <div class="actions">
    <div class="wrap btn-row">
      <button class="btn main" id="a-live">🔴 配信する</button>
      <button class="btn violet" id="a-collab">🤝 コラボ</button>
      <button class="btn" id="a-rest">😴</button>
    </div>
  </div>
</section>

<!-- ===== 配信中 ===== -->
<section id="live" class="hidden">
  <div class="live-top">
    <div class="live-meta">
      <span class="live-flag">LIVE</span>
      <span>👀 <b id="l-viewers">0</b></span>
      <span id="l-round"></span>
      <button class="end" id="l-end">配信を終える</button>
    </div>
    <div class="live-title" id="l-title"></div>
    <div class="hype"><i id="l-hype" style="width:30%"></i></div>
  </div>
  <div id="chat"></div>
  <div class="live-bottom">
    <div class="pick-preview" id="l-pick">💬 拾いたいコメントをタップ</div>
    <div class="chips" id="l-styles"></div>
    <div class="send-row">
      <input id="l-text" class="in" placeholder="自分の言葉で返す（空なら↑の方針でおまかせ）" maxlength="120">
      <button class="btn main small" id="l-send" style="flex:none">返す</button>
    </div>
  </div>
</section>

<div id="sheet-root"></div>

<script>
"use strict";

/* ================= 定数 ================= */
const SAVE_KEY = "live-v1";
const SETTINGS_KEY = "buzzlife-settings";   // APIキーは前のゲームと共通
const LAST_DAY = 30;
const ROUNDS = 3;                            // 1回の配信で返せる回数
const LIVE_ENERGY = 25;
const COLLAB_ENERGY = 30;
const DATE_ENERGY = 20;
const DATE_COST = 3000;
const GIFT_COST = 2000;

const AVATARS = ["🎧", "🎮", "🐺", "🦁", "🔥", "⚡", "🌙", "🎸", "🍜", "🐶", "😎", "🦊"];
const GENRES = ["雑談", "ゲーム実況", "歌", "料理", "深夜ラジオ", "筋トレ", "お絵かき"];
const STYLES = [
  { id: "kind", label: "😊 やさしく" },
  { id: "tease", label: "😏 いじる" },
  { id: "hot", label: "🔥 熱く語る" },
  { id: "boke", label: "🤪 ボケる" },
  { id: "sweet", label: "💗 ドキッとさせる" },
];
const THEMES = ["まったり雑談", "リスナーのお悩み相談", "今日あったこと", "恋バナ", "ホラーゲーム", "歌ってみた", "深夜の飯テロ", "質問コーナー"];
const DATE_SPOTS = ["カフェ", "水族館", "夜景の見える公園", "遊園地", "おうちで映画", "ゲームセンター"];

const HEROINES = [
  {
    id: "miyu", name: "みゆ", avatar: "🐰", role: "listener", label: "常連リスナー", love: 15,
    persona: "初配信からずっと見ている古参リスナー。大学生。人見知りでコメントは控えめ、語尾に「…！」が多い。実はかなりのガチ恋で、名前を呼ばれると舞い上がる。ほかの女の子と仲良くされると少しへこむ。",
  },
  {
    id: "reika", name: "レイカ", avatar: "🦋", role: "streamer", label: "人気配信者（先輩）", love: 5, subs: 300000, collabAt: 30,
    persona: "登録者30万人の人気配信者。大人っぽくてクール、人をからかうのが好き。でも本当は寂しがりで、本音を見せられる相手がいない。主人公のことを最初は「面白い新人」くらいに見ている。",
  },
  {
    id: "hiyori", name: "ひより", avatar: "🌻", role: "streamer", label: "新人配信者（後輩）", love: 10, subs: 900, collabAt: 0,
    persona: "デビューしたての新人配信者。元気で天然、主人公を「先輩」と呼んで慕う。ドジだけど一生懸命で、褒められるとすぐ照れる。",
  },
  {
    id: "kuroneko", name: "黒猫", avatar: "🐈‍⬛", role: "mystery", label: "謎の高額スパチャ", love: 0,
    realName: "星野ルナ", realLabel: "人気アイドル",
    persona: "正体は人気アイドルの星野ルナ。仕事の疲れを、主人公の配信を見て癒やしている。正体がバレないよう、短く謎めいた言葉づかいをするが、ふとした言葉に育ちの良さと孤独がにじむ。",
  },
];
const HERO = Object.fromEntries(HEROINES.map((h) => [h.id, h]));

/* ================= 状態 ================= */
let S = null;
let SET = { apiKey: "", model: "auto" };
let busy = false;
let openThread = null;        // DMで開いているスレッド
let pick = null;              // 配信中に拾ったコメント
let style = "kind";

function loadAll() {
  try { SET = { ...SET, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") }; } catch { /* 初回 */ }
  try { S = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch { S = null; }
}
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch { toast("保存できませんでした（容量不足？）"); }
}
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(SET)); } catch { /* 無視 */ }
}

function newGame(me) {
  S = {
    me, day: 1, subs: 50, energy: 100, money: 0, ended: false,
    hearts: Object.fromEntries(HEROINES.map((h) => [h.id, {
      love: h.love, dates: 0, known: h.id !== "kuroneko", revealed: false, sentToday: false, events: [],
    }])),
    partner: null, rumor: null,
    dm: Object.fromEntries(HEROINES.map((h) => [h.id, { msgs: [], unread: 0, pending: null }])),
    log: [], history: [{ day: 0, subs: 50 }], stream: null, epilogue: null,
  };
  addLog(`${me.name} が配信者デビュー！ 🎉`);
  save();
}

/* ================= 小道具 ================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function fmt(n) {
  n = Math.round(n);
  if (n >= 10000) return (n / 10000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, "") + "万";
  return n.toLocaleString("ja-JP");
}
const yen = (n) => "¥" + Math.round(n).toLocaleString("ja-JP");
let toastTimer = null;
function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2800);
}
function addLog(text) {
  S.log.unshift({ day: S.day, text });
  if (S.log.length > 60) S.log.length = 60;
}
function heroName(id) {

}

}

}
function addLove(id, delta) {

/* ================= Gemini ================= */
function toGeminiSchema(schema) {
  const out = {};
  for (const [k, v] of Object.entries(schema)) {
    if (k === "type") out.type = String(v).toUpperCase();
    else if (k === "items") out.items = toGeminiSchema(v);
    else if (k === "properties") out.properties = Object.fromEntries(Object.entries(v).map(([pk, pv]) => [pk, toGeminiSchema(pv)]));
    else out[k] = v;
  }
  return out;
}

async function listModels() {
  let res;
  try {
    res = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000", { headers: { "x-goog-api-key": SET.apiKey } });
  } catch {
    throw new Error("通信できませんでした。電波を確認してね");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 400 || res.status === 403) throw new Error("APIキーが正しくないみたい");
    throw new Error(`モデル一覧を取得できませんでした（${res.status}）`);
  }
  return (data.models || [])
    .filter((m) => (m.supportedGenerationMethods || []).includes("generateContent"))
    .map((m) => String(m.name).replace(/^models\//, ""))
    .filter((n) => /^gemini/.test(n) && !/image|tts|audio|live|embed|robotics|computer|native|learnlm/.test(n));
}
function modelScore(n) {
  const v = parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || "0");
  let s = v * 10;
  if (/flash/.test(n)) s += 100;
  if (/lite/.test(n)) s -= 30;
  if (/pro|ultra/.test(n)) s -= 60;
  if (/preview|exp/.test(n)) s -= 15;
  if (/latest/.test(n)) s += 35;
  return s;
}
function sortModels(names) { return [...names].sort((a, b) => modelScore(b) - modelScore(a)); }
async function resolveModel() {
  const best = sortModels(await listModels())[0];
  if (!best) throw new Error("このAPIキーで使えるGeminiのモデルが見つかりませんでした");
  SET.model = best;
  saveSettings();
  return best;
}

const SWITCHABLE = [404, 429, 500, 503];
async function callModel(model, system, prompt, schema) {
  let res;
  try {
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": SET.apiKey },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: system }] },
        contents: [{ role: "user", parts: [{ text: prompt }] }],
        generationConfig: { responseMimeType: "application/json", responseSchema: toGeminiSchema(schema), temperature: 1.0 },
      }),
    });
  } catch {
    throw new Error("通信できませんでした。電波を確認してね");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = data.error?.message ?? "";
    let text = `Geminiエラー ${res.status}: ${msg}`;
    if (res.status === 429) text = "無料枠の回数制限です。1〜2分待ってもう一度（1日の上限なら明日）";
    else if (res.status === 400 && /API key/i.test(msg)) text = "APIキーが正しくないみたい";
    else if (res.status === 404) text = `モデル「${model}」が見つかりません（設定で変更してね）`;
    else if (res.status === 503 || res.status === 500) text = "Geminiが混み合っています。少し待ってもう一度";
    throw Object.assign(new Error(text), { status: res.status });
  }
  const cand = data.candidates?.[0];
  const text = (cand?.content?.parts ?? []).filter((p) => !p.thought && p.text).map((p) => p.text).join("");
  if (!text) throw new Error("AIがうまく書けませんでした（内容がブロックされたかも）。言い方を変えてもう一度");
  try {
    return JSON.parse(text.replace(/^```(?:json)?\s*|\s*```$/g, ""));
  } catch {
    throw new Error("AIの返事を読み取れませんでした。もう一度試してね");
  }
}

async function gemini(prompt, schema) {
  if (!SET.apiKey) throw new Error("APIキーが設定されていません（自分タブ→設定）");
  const system = systemPrompt();
  const model = !SET.model || SET.model === "auto" ? await resolveModel() : SET.model;
  let first;
  try {
    return await callModel(model, system, prompt, schema);
  } catch (e) {
    if (!SWITCHABLE.includes(e.status)) throw e;
    first = e;
  }
  if (first.status === 503 || first.status === 500) {
    await sleep(2000);
    try {
      return await callModel(model, system, prompt, schema);
    } catch (e) {
      if (!SWITCHABLE.includes(e.status)) throw e;
    }
  }
  let others = [];
  try {
    others = sortModels(await listModels()).filter((n) => n !== model).slice(0, 4);
  } catch {
    throw first;
  }
  for (const m of others) {
    try {
      const r = await callModel(m, system, prompt, schema);
      SET.model = m;
      saveSettings();
      toast(`${model} がダメだったので ${m} に切り替えました`);
      return r;
    } catch (e) {
      if (!SWITCHABLE.includes(e.status)) throw e;
    }
  }
  throw first;
}

## 書いてほしいもの（JSON）

${collabId ? `- partnerLine: コラボ相手${heroName(collabId)}の最初のあいさつ（配信上のセリフ）` : "- partnerLine: 空文字"}`,

    if (who) user = who === "kuroneko" && !S.hearts.kuroneko.revealed ? "黒猫" : heroName(who);
    st.chat.push({ kind: "c", user, text: String(c.text || "").slice(0, 200), who, sc, id: Math.random().toString(36).slice(2) });
    if (sc) st.sc += sc;
    if (who === "kuroneko" && !S.hearts.kuroneko.known) {
      S.hearts.kuroneko.known = true;
      addLog("🐈‍⬛ 謎のリスナー「黒猫」から高額スパチャが届いた…");

    { type: "object", properties: { myLine: STR, partnerLine: STR, hype: INT, comments: CHAT_LIST, love: LOVE_LIST }, required: ["myLine", "partnerLine", "hype", "comments", "love"] });

function endStream() {
  const st = S.stream;
  if (!st || busy) return;
  const avg = st.hype.length ? st.hype.reduce((a, b) => a + b, 0) / st.hype.length : 25;
  let gain = Math.round(st.peak * (0.2 + avg / 150) * rand(0.8, 1.2) + (st.partner ? st.peak * 0.05 : 0));
  if (st.round === 0) gain = Math.round(gain * 0.3);
  let rumorLoss = 0;
  if (S.rumor) {
    rumorLoss = Math.round(S.subs * rand(0.03, 0.07));
    addLog(`😱 熱愛疑惑のせいでガチ恋勢が離れた…（-${fmt(rumorLoss)}）`);
    S.rumor = null;
  }
  const before = S.subs;
  S.subs = Math.max(10, S.subs + gain - rumorLoss);
  S.money += st.sc;
  if (st.partner) {
    addEvent(st.partner, `コラボ配信「${st.theme}」`);
    addLove(st.partner, 4);
    if (S.partner && S.partner !== st.partner) queueDM(S.partner, "jealous");
  }
  addLog(`🔴 配信「${st.theme}」 最大同接 ${fmt(st.peak)} ／ 登録者 +${fmt(gain)}${st.sc ? ` ／ スパチャ ${yen(st.sc)}` : ""}`);
  S.stream = null;
  $("live").classList.add("hidden");
  $("game").classList.remove("hidden");
  endDay();
  openSheet(`

    ${st.sc ? `<p class="note">💰 スパチャ ${yen(st.sc)}</p>` : ""}
    <button class="btn main block" style="margin-top:12px" onclick="closeSheet()">OK</button>`);

// 種類: normal / date (彼女から誘う) / confess (彼女から告白) / jealous (恋人が嫉妬) / reveal (黒猫の正体)
function queueDM(id, type = "normal") {
  const t = S.dm[id];
  if (t.pending) return;
  t.pending = { type };
  t.unread += 1;
}

function rollDMs() {
  const pendingCount = HEROINES.filter((h) => S.dm[h.id].pending).length;
  if (pendingCount >= 2) return;
  const cands = HEROINES.filter((h) => {
    const st = S.hearts[h.id];
    if (S.dm[h.id].pending) return false;
    if (h.id === "kuroneko") return st.known && (st.love >= 15 || S.day >= 5);
    if (h.id === "reika") return st.love >= 15 || st.events.length > 0;
    return true;
  });
  if (!cands.length || Math.random() > 0.65) return;
  // 好感度が高い子ほど連絡が来やすい
  const total = cands.reduce((a, h) => a + 1 + S.hearts[h.id].love / 15, 0);
  let x = Math.random() * total;
  let h = cands[0];
  for (const c of cands) { x -= 1 + S.hearts[c.id].love / 15; if (x <= 0) { h = c; break; } }
  const st = S.hearts[h.id];
  let type = "normal";
  if (h.id === "kuroneko" && !st.revealed && (st.love >= 45 || S.day >= 20)) type = "reveal";
  else if (!S.partner && st.love >= 90 && st.dates >= 1 && Math.random() < 0.5) type = "confess";
  else if (S.partner !== h.id && st.love >= 60 && st.dates === 0 && Math.random() < 0.5) type = "date";
  queueDM(h.id, type);
}

/* ================= 1日の終わり ================= */
function endDay() {
  S.history.push({ day: S.day, subs: S.subs });
  for (const h of HEROINES) S.hearts[h.id].sentToday = false;
  rollDMs();
  // 恋人は毎日ちょっとずつ連絡をくれる
  if (S.partner && !S.dm[S.partner].pending && Math.random() < 0.5) queueDM(S.partner, "normal");
  if (S.day >= LAST_DAY) S.ended = true;
  else S.day += 1;
  save();
  render();
  const unread = HEROINES.filter((h) => S.dm[h.id].pending).map((h) => h.id === "kuroneko" && !S.hearts.kuroneko.revealed ? "黒猫" : heroName(h.id));
  if (unread.length) setTimeout(() => toast(`💌 ${unread.join("・")} からDMが届いています`), 600);
  // 最終日が終わったらエンディングへ（結果画面などが開いていれば、それを閉じたときに出る）
  if (S.ended) setTimeout(() => { if (!$("sheet-root").innerHTML && !S.stream) showEnding(); }, 400);
}

    { type: "object", properties: { epilogue: STR }, required: ["epilogue"] });
    S.epilogue = String(r.epilogue || "");
    save();
    if ($("epi")) $("epi").textContent = S.epilogue;
  } catch (e) {
    if ($("epi")) $("epi").textContent = "（エピローグを読み込めませんでした: " + e.message + "）";
  }
}
function replay() {
  const me = S.me;
  newGame(me);
  closeSheetOnly();
  render();
}

/* ================= 描画 ================= */
function render() {
  if (!S) return;
  $("h-name").textContent = `${S.me.avatar} ${S.me.name}`;
  $("h-day").textContent = S.ended ? "最終日おわり" : `${S.day} / ${LAST_DAY}日目`;
  $("h-subs").textContent = fmt(S.subs);
  $("h-energy").textContent = S.energy;
  $("h-energy-bar").style.width = S.energy + "%";
  $("h-money").textContent = yen(S.money);
  const unread = HEROINES.reduce((a, h) => a + (S.dm[h.id].pending ? 1 : 0), 0);
  $("dm-badge").textContent = unread;
  $("dm-badge").classList.toggle("hidden", !unread);
  $("a-live").textContent = S.ended ? "🏁 結果を見る" : S.energy < LIVE_ENERGY ? "😵 体力不足" : "🔴 配信する";
  $("a-collab").disabled = S.ended;
  $("a-rest").disabled = S.ended;

  // ホーム
  const known = HEROINES.filter((h) => S.hearts[h.id].known);
  $("v-home").innerHTML = `
    ${S.rumor ? `<div class="card" style="border:2px solid var(--red)"><b>📸 熱愛疑惑が出回っている…</b><p class="hint" style="margin:4px 0 0">次の配信でリスナーにどう説明する？</p></div>` : ""}
    ${S.partner ? `<div class="card"><div class="row"><div class="avatar">${HERO[S.partner].avatar}</div><div><div class="name">💕 ${esc(heroName(S.partner))}と交際中</div><div class="sub">リスナーにはナイショ</div></div></div></div>` : ""}
    <div class="card"><b>きょうの出来事</b>
      ${S.log.slice(0, 14).map((l) => `<div class="log-item"><b>${l.day}日目</b>${esc(l.text)}</div>`).join("")}
    </div>`;

  // DM一覧 or スレッド
  if (openThread) renderThread();
  else {
    $("v-dm").innerHTML = `<div class="card">${known.map((h) => {
      const t = S.dm[h.id];
      const last = t.pending?.message || t.msgs.filter((m) => m.from !== "sys").slice(-1)[0]?.text || (t.pending ? "新しいメッセージ" : "まだやりとりなし");
      const label = h.id === "kuroneko" && !S.hearts.kuroneko.revealed ? "黒猫" : heroName(h.id);
      return `<div class="thread" data-t="${h.id}">
        <div class="avatar">${h.avatar}</div>
        <div style="flex:1;min-width:0"><div class="name">${esc(label)}</div><div class="last">${t.pending && !t.pending.message ? "💌 新しいメッセージ" : esc(last)}</div></div>
        ${t.pending ? '<span class="dot"></span>' : ""}</div>`;
    }).join("")}</div>`;
    $("v-dm").querySelectorAll("[data-t]").forEach((el) => el.onclick = () => { openThread = el.dataset.t; renderThread(); });
  }

  // 関係
  $("v-hearts").innerHTML = known.map((h) => {
    const st = S.hearts[h.id];
    const label = h.id === "kuroneko" && !st.revealed ? "黒猫" : heroName(h.id);
    return `<div class="card">
      <div class="row"><div class="avatar">${h.avatar}</div>
        <div style="flex:1"><div class="name">${esc(label)} <span class="stage">${esc(stageOf(h.id))}</span></div>
        <div class="sub">${esc(h.id === "kuroneko" && st.revealed ? h.realLabel : h.id === "kuroneko" ? "謎の高額スパチャ" : h.label)}</div></div>
        <div class="hearts">${heartsOf(st.love)}</div></div>
      <div class="love-bar"><i style="width:${st.love}%"></i></div>
      <p class="hint" style="margin:6px 0 0">${esc(st.events.slice(-2).join(" / ") || "まだ思い出はない")}</p>
    </div>`;
  }).join("") + (known.length < HEROINES.length ? `<p class="note">？？？ まだ出会っていない人がいる…</p>` : "");

  // 自分
  $("v-me").innerHTML = `
    <div class="card"><div class="row"><div class="avatar">${esc(S.me.avatar)}</div>
      <div><div class="name">${esc(S.me.name)}</div><div class="sub">${esc(S.me.genre)}配信 ・ ${titleFor(S.subs)}</div></div></div>
      <p style="margin:8px 0 0;font-size:14px">${esc(S.me.persona)}</p></div>
    <div class="card"><b>登録者の推移</b>${chartSvg()}</div>
    <button class="btn block" onclick="openSettings()">⚙️ 設定（APIキー・リセット）</button>`;
}

function renderThread(typing = false) {
  const id = openThread;
  const h = HERO[id];
  const st = S.hearts[id];
  const t = S.dm[id];
  const label = id === "kuroneko" && !st.revealed ? "黒猫" : heroName(id);
  const canDate = (st.love >= 60 || st.dateInvite) && !S.ended;
  const canConfess = !S.partner && st.love >= 70 && st.dates >= 1 && !S.ended;
  $("v-dm").innerHTML = `
    <div class="card">
      <div class="row">
        <button class="btn small" id="th-back">←</button>
        <div class="avatar">${h.avatar}</div>
        <div style="flex:1"><div class="name">${esc(label)}</div><div class="sub">${esc(stageOf(id))} ${heartsOf(st.love)}</div></div>
      </div>
      <div class="bubbles">
        ${t.msgs.map((m) => `<div class="bub ${m.from}">${esc(m.text)}</div>`).join("") || '<div class="bub sys">まだメッセージはありません</div>'}
        ${t.pending && !t.pending.message ? '<div class="typing" id="th-loading">💌 メッセージを開いています…</div>' : ""}
        ${typing ? '<div class="typing">入力中…</div>' : ""}
      </div>
      ${t.pending?.choices ? `<p class="hint">返信をえらぶ（または自由に書く）</p>
        ${t.pending.choices.map((c, i) => `<button class="choice" data-ch="${i}">${esc(c.text)}</button>`).join("")}` : ""}
      ${t.pending?.message || !t.pending ? `
        <div class="send-row" style="margin-top:10px">
          <input id="th-text" class="in" placeholder="${t.pending ? "自分の言葉で返信" : st.sentToday ? "今日はもう送った（明日また）" : "メッセージを送る（1日1回）"}" maxlength="120" ${!t.pending && st.sentToday ? "disabled" : ""}>
          <button class="btn main small" id="th-send" style="flex:none" ${busy || (!t.pending && st.sentToday) ? "disabled" : ""}>送信</button>
        </div>` : ""}
      <div class="btn-row" style="margin-top:10px;flex-wrap:wrap">
        <button class="btn small" id="th-gift">🎁 プレゼント ${yen(GIFT_COST)}</button>
        ${canDate ? `<button class="btn small violet" id="th-date">💗 デートに行く</button>` : ""}
        ${canConfess ? `<button class="btn small main" id="th-confess" style="flex:none">💌 告白する</button>` : ""}
      </div>
      ${!canDate && !S.partner ? `<p class="hint" style="margin-top:6px">好感度60でデートに誘えるようになる</p>` : ""}
    </div>`;
  $("th-back").onclick = () => { openThread = null; render(); };
  $("v-dm").querySelectorAll("[data-ch]").forEach((b) => b.onclick = () => chooseDM(id, Number(b.dataset.ch)));
  const send = $("th-send");
  if (send) send.onclick = () => {
    const v = $("th-text").value.trim();
    if (!v || busy) return;
    freeReply(id, v);
  };
  $("th-gift").onclick = () => sendGift(id);
  if ($("th-date")) $("th-date").onclick = () => openDate(id);
  if ($("th-confess")) $("th-confess").onclick = () => {
    if (confirm(`${label}に告白する？`)) confess(id);
  };
  // 届いたDMを開く
  if (t.pending && !t.pending.message && !busy) {
    busy = true;
    loadPending(id).then(() => { t.unread = 0; }).catch((e) => toast(e.message)).finally(() => {
      busy = false;
      if (openThread === id) { render(); }
    });
  }
}

function chartSvg() {
  const h = S.history;
  if (h.length < 2) return `<p class="hint">配信するとグラフが出ます</p>`;
  const W = 320, H = 110, pad = 6;
  const max = Math.max(...h.map((x) => x.subs));
  const min = Math.min(...h.map((x) => x.subs));
  const xs = (i) => pad + (i / (h.length - 1)) * (W - pad * 2);
  const ys = (v) => H - pad - ((v - min) / Math.max(1, max - min)) * (H - pad * 2);
  const pts = h.map((x, i) => `${xs(i).toFixed(1)},${ys(x.subs).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="登録者の推移">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </svg><div class="hint" style="display:flex;justify-content:space-between"><span>${fmt(min)}</span><span>最高 ${fmt(max)}</span></div>`;
}

/* ================= セットアップ ================= */
function showSetup() {
  $("game").classList.add("hidden");
  $("live").classList.add("hidden");
  $("setup").classList.remove("hidden");
  let avatar = AVATARS[0];
  let genre = GENRES[0];
  $("s-key").value = SET.apiKey;
  $("s-avatars").innerHTML = AVATARS.map((a) => `<button class="chip emoji-chip ${a === avatar ? "on" : ""}" data-v="${a}">${a}</button>`).join("");
  $("s-genres").innerHTML = GENRES.map((g) => `<button class="chip ${g === genre ? "on" : ""}" data-v="${g}">${g}</button>`).join("");
  const bind = (box, set) => box.querySelectorAll(".chip").forEach((b) => b.onclick = () => {
    set(b.dataset.v);
    box.querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x === b));
  });
  bind($("s-avatars"), (v) => { avatar = v; });
  bind($("s-genres"), (v) => { genre = v; });
  $("s-start").onclick = () => {
    const key = $("s-key").value.trim();
    const name = $("s-name").value.trim();
    const persona = $("s-persona").value.trim();
    if (!key) return toast("APIキーを入れてね");
    if (!name) return toast("配信者名を入れてね");
    if (!persona) return toast("キャラ・しゃべり方を入れてね");
    SET.apiKey = key;
    if (!SET.model) SET.model = "auto";
    saveSettings();
    newGame({ name, avatar, genre, persona });
    showGame();
  };
}

function showGame() {
  $("setup").classList.add("hidden");
  $("game").classList.remove("hidden");
  window.scrollTo(0, 0);
  render();
  if (S.stream) showLive();         // 配信の途中で閉じた場合は続きから
  else if (S.ended) showEnding();
}

/* ================= 起動 ================= */
document.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
  for (const v of ["home", "dm", "hearts", "me"]) $("v-" + v).classList.toggle("hidden", v !== t.dataset.tab);
  if (t.dataset.tab === "dm") { openThread = null; render(); }
});
$("a-live").onclick = () => (S.ended ? showEnding() : startLive());
$("a-collab").onclick = openCollab;
$("a-rest").onclick = doRest;
$("l-send").onclick = sendReply;
$("l-text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) sendReply(); });
$("l-end").onclick = () => {
  if (busy) return;
  if (S.stream.round < ROUNDS && !confirm("配信を終える？（途中で終えると登録者が増えにくい）")) return;
  endStream();
};

loadAll();
if (S && S.me) showGame();
else showSetup();
</script>
