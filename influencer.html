<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff4f8b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="バズれ！">
  <title>バズれ！AIインフルエンサー</title>
  <style>
    /* ===== 色 ===== */
    :root {
      --bg: #fff6f9;
      --card: #ffffff;
      --text: #2a1f2d;
      --muted: #8a7a8f;
      --line: #f0dbe4;
      --pink: #ff4f8b;
      --pink-soft: #ffe3ee;
      --violet: #7b5cff;
      --gold: #ffb020;
      --green: #19b37a;
      --red: #ef4444;
      --shadow: 0 6px 20px rgba(255, 79, 139, .12);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #160f1a; --card: #221a28; --text: #f6eef8; --muted: #a596ab; --line: #3a2d42;
        --pink-soft: #3d1f2e; --shadow: 0 6px 20px rgba(0, 0, 0, .35); color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #160f1a; --card: #221a28; --text: #f6eef8; --muted: #a596ab; --line: #3a2d42;
      --pink-soft: #3d1f2e; --shadow: 0 6px 20px rgba(0, 0, 0, .35); color-scheme: dark;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 15px; line-height: 1.6;
      padding-bottom: calc(150px + env(safe-area-inset-bottom));
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
    .hidden { display: none !important; }

    /* ===== ヘッダー ===== */
    header {
      position: sticky; top: 0; z-index: 5;
      background: linear-gradient(135deg, var(--pink), var(--violet));
      color: #fff; padding: calc(10px + env(safe-area-inset-top)) 0 10px;
      box-shadow: 0 2px 12px rgba(123, 92, 255, .25);
    }
    .head-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .logo { font-weight: 800; font-size: 18px; letter-spacing: .02em; }
    .day-badge { background: rgba(255,255,255,.22); border-radius: 99px; padding: 2px 12px; font-weight: 700; font-size: 13px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
    .stat { background: rgba(255,255,255,.18); border-radius: 12px; padding: 4px 6px; text-align: center; }
    .stat b { display: block; font-size: 15px; line-height: 1.2; }
    .stat small { font-size: 10px; opacity: .9; }
    .bar { height: 4px; background: rgba(255,255,255,.3); border-radius: 4px; margin-top: 3px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: #fff; border-radius: 4px; transition: width .4s; }

    /* ===== タブ ===== */
    .tabs { display: flex; gap: 6px; margin: 12px 0; }
    .tab { flex: 1; border: 0; background: var(--card); border-radius: 99px; padding: 8px 0; font-weight: 700; color: var(--muted); box-shadow: var(--shadow); }
    .tab.on { background: var(--text); color: var(--bg); }

    /* ===== カード ===== */
    .card { background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
    .post-head { display: flex; gap: 10px; align-items: center; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--pink-soft); display: grid; place-items: center; font-size: 24px; flex: none; }
    .name { font-weight: 800; }
    .handle { color: var(--muted); font-size: 12px; }
    .me-tag { background: var(--pink); color: #fff; border-radius: 6px; font-size: 10px; padding: 0 6px; margin-left: 4px; vertical-align: 2px; }
    .pr-tag { background: var(--gold); color: #fff; border-radius: 6px; font-size: 10px; padding: 0 6px; margin-left: 4px; vertical-align: 2px; }
    .post-text { margin: 8px 0 6px; white-space: pre-wrap; word-break: break-word; }
    .post-meta { display: flex; gap: 14px; color: var(--muted); font-size: 13px; }
    .buzz { margin-left: auto; font-weight: 700; }
    .comments { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 6px; }
    .comment { font-size: 13px; padding: 3px 0; }
    .comment b { margin-right: 6px; }
    .comment.bad b { color: var(--red); }
    .review { background: var(--pink-soft); border-radius: 12px; padding: 8px 10px; font-size: 13px; margin-top: 8px; }
    .note { text-align: center; color: var(--muted); font-size: 13px; margin: 10px 0; }
    .flame-card { border: 2px solid var(--red); }

    /* ===== ランキング ===== */
    .rank-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .rank-row:last-child { border-bottom: 0; }
    .rank-no { width: 26px; font-weight: 800; text-align: center; color: var(--muted); }
    .rank-row.me { background: var(--pink-soft); border-radius: 12px; padding-left: 6px; }
    .rank-f { margin-left: auto; font-weight: 800; }

    /* ===== 下のアクションバー ===== */
    .actions {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
      background: var(--card); border-top: 1px solid var(--line);
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
    }
    .trend-line { font-size: 12px; color: var(--muted); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .trend-line b { color: var(--violet); }
    .btn-row { display: flex; gap: 8px; }
    .btn { border: 0; border-radius: 14px; padding: 12px 14px; font-weight: 800; background: var(--pink-soft); color: var(--text); }
    .btn.main { flex: 1; background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff; }
    .btn.danger { background: var(--red); color: #fff; }
    .btn:disabled { opacity: .45; }
    .btn.block { width: 100%; }

    /* ===== フォーム ===== */
    label.f { display: block; font-weight: 700; font-size: 13px; margin: 12px 0 4px; }
    .hint { font-size: 12px; color: var(--muted); }
    input.in, textarea.in, select.in {
      width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px;
      background: var(--bg); outline: none;
    }
    input.in:focus, textarea.in:focus { border-color: var(--pink); }
    textarea.in { min-height: 70px; resize: vertical; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
    .chip.on { border-color: var(--pink); background: var(--pink); color: #fff; }
    .emoji-chip { font-size: 22px; padding: 2px 8px; }

    /* ===== モーダル ===== */
    .sheet-bg { position: fixed; inset: 0; background: rgba(20, 10, 25, .45); z-index: 10; display: flex; align-items: flex-end; }
    .sheet {
      width: 100%; max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 22px 22px 0 0;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto;
      animation: up .22s ease-out;
    }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } }
    .sheet h2 { margin: 0 0 4px; font-size: 18px; }
    .shop-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .shop-item .ico { font-size: 28px; }
    .shop-item .desc { flex: 1; font-size: 13px; }

    /* ===== 結果演出 ===== */
    .result-num { font-size: 34px; font-weight: 900; text-align: center; margin: 6px 0; }
    .up { color: var(--green); }
    .down { color: var(--red); }
    .meter { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0 2px; }
    .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--pink), var(--violet)); border-radius: 99px; transition: width .8s; }
    .big-emoji { font-size: 52px; text-align: center; }

    .toast {
      position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 99px; z-index: 20;
      font-weight: 700; font-size: 13px; max-width: calc(100% - 32px); text-align: center;
    }
    .loading { text-align: center; padding: 24px 0; }
    .spinner { width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--pink-soft); border-top-color: var(--pink); margin: 0 auto 10px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: var(--violet); }
  </style>
</head>
<body>

<!-- ===== 最初の設定画面 ===== -->

  <header><div class="wrap"><div class="logo">🌟 バズれ！AIインフルエンサー</div></div></header>

<!-- ===== ゲーム画面 ===== -->
<section id="game" class="hidden">
  <header>

<div id="sheet-root"></div>

<script>
"use strict";

/* ================= 定数 ================= */
const SAVE_KEY = "buzzlife-v1";
const SETTINGS_KEY = "buzzlife-settings";
const LAST_DAY = 30;
const POST_ENERGY = 25;
const REST_ENERGY = 45;

const AVATARS = ["🌸", "🐰", "🦊", "🐱", "🌈", "🍓", "⚡", "🎮", "👑", "🧋", "🌙", "🔥"];
const GENRES = ["グルメ", "ファッション", "ゲーム", "旅行", "美容", "筋トレ", "ペット", "お笑い", "勉強", "音楽"];
const TONES = [
  { id: "safe", label: "😇 まじめ", desc: "ていねいで好感度重視。炎上しにくいけどバズりにくい" },
  { id: "emo", label: "🥺 エモい", desc: "共感を誘う、心に刺さる系" },
  { id: "funny", label: "🤣 ネタ", desc: "笑いを取りにいく。ハマれば大きい" },
  { id: "useful", label: "💡 お役立ち", desc: "保存されるタメになる情報" },
  { id: "spicy", label: "🌶️ 攻める", desc: "物議をかもす強い意見。大バズか大炎上か" },
];
const START_TRENDS = ["#月曜日の朝", "#推し活", "#コンビニ新作", "#雨の日コーデ", "#深夜テンション", "#節約生活",
  "#秋の味覚", "#休日の過ごし方", "#今日のごはん", "#ちょっと聞いて", "#自分へのご褒美", "#朝活"];
const RIVALS = [
  { name: "ミナミ", handle: "minami_kuidaore", avatar: "🍜", genre: "グルメ", persona: "大阪出身の食べ歩き女子。コテコテの関西弁でテンション高め。", followers: 2000 },
  { name: "レン", handle: "ren_mode", avatar: "🕶️", genre: "ファッション", persona: "クールで少し毒舌なモデル。短文でキメる。流行りものには辛口。", followers: 8000 },
  { name: "ぽてと", handle: "potato_gaming", avatar: "🥔", genre: "ゲーム", persona: "ゆるいゲーム実況者。「〜っす」口調。よく寝落ちする。", followers: 25000 },
  { name: "ケンジ社長", handle: "kenji_ceo", avatar: "💼", genre: "ビジネス", persona: "意識高い系の若手社長。朝4時起き。カタカナビジネス用語を多用する。", followers: 80000 },
];
const SHOP = [
  { id: "light", ico: "💡", name: "リングライト", price: 3000, desc: "写真映えUP。ずっとバズり度+5", once: true },
  { id: "drink", ico: "🥤", name: "高級エナドリ", price: 800, desc: "元気+40" },
  { id: "ad", ico: "📣", name: "SNS広告", price: 5000, desc: "フォロワーをお金で増やす（好感度-3）" },
  { id: "trip", ico: "🏝️", name: "デトックス旅行", price: 10000, desc: "炎上リセット・好感度+15・元気全回復（1日使う）" },
  { id: "editor", ico: "🎬", name: "プロ編集者を雇う", price: 25000, desc: "ずっとバズり度+8", once: true },
];

/* ================= 状態 ================= */
let S = null;          // ゲームのセーブデータ
let SET = { apiKey: "", model: "auto" };
let busy = false;

function loadAll() {
  try { SET = { ...SET, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") }; } catch { /* 初回 */ }
  try { S = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch { S = null; }
}
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch { toast("保存できませんでした（容量不足？）"); }
}
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(SET)); } catch { /* 無視 */ }
}

function newGame(me) {
  const pick = [...START_TRENDS].sort(() => Math.random() - 0.5).slice(0, 3);
  S = {
    me, day: 1, followers: 100, energy: 100, image: 50, flame: 0, money: 1000,
    gear: [], pendingPR: null, offer: null, ended: false,
    rivals: RIVALS.map((r) => ({ ...r })),
    trends: pick, timeline: [], seq: 1,
    history: [{ day: 0, followers: 100 }],
  };
  addNote(`${me.name} がデビューしました！ 🎉`);
  save();
}

/* ================= 小道具 ================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function fmt(n) {
  n = Math.round(n);
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, "") + "億";
  if (n >= 10000) return (n / 10000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, "") + "万";
  return n.toLocaleString("ja-JP");
}
const yen = (n) => "¥" + Math.round(n).toLocaleString("ja-JP");
let toastTimer = null;
function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}
function addNote(text) {
  S.timeline.unshift({ id: S.seq++, type: "note", day: S.day, text });
  trimTimeline();
}
function trimTimeline() { if (S.timeline.length > 80) S.timeline.length = 80; }
const buzzBonus = () => (S.gear.includes("light") ? 5 : 0) + (S.gear.includes("editor") ? 8 : 0);

/* ================= Gemini ================= */
function toGeminiSchema(schema) {
  const out = {};
  for (const [k, v] of Object.entries(schema)) {
    if (k === "type") out.type = String(v).toUpperCase();
    else if (k === "items") out.items = toGeminiSchema(v);
    else if (k === "properties") out.properties = Object.fromEntries(Object.entries(v).map(([pk, pv]) => [pk, toGeminiSchema(pv)]));
    else out[k] = v;
  }
  return out;
}

// このAPIキーで使えるモデルの一覧（文章を作れるGeminiだけ）
async function listModels() {
  let res;
  try {
    res = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000", { headers: { "x-goog-api-key": SET.apiKey } });
  } catch {
    throw new Error("通信できませんでした。電波を確認してね");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 400 || res.status === 403) throw new Error("APIキーが正しくないみたい");
    throw new Error(`モデル一覧を取得できませんでした（${res.status}）`);
  }
  return (data.models || [])
    .filter((m) => (m.supportedGenerationMethods || []).includes("generateContent"))
    .map((m) => String(m.name).replace(/^models\//, ""))
    .filter((n) => /^gemini/.test(n) && !/image|tts|audio|live|embed|robotics|computer|native|learnlm/.test(n));
}

// 新しくて軽いFlash系を優先して1つ選ぶ
function modelScore(n) {
  const v = parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || "0");
  let s = v * 10;
  if (/flash/.test(n)) s += 100;
  if (/lite/.test(n)) s -= 30;
  if (/pro|ultra/.test(n)) s -= 60;
  if (/preview|exp/.test(n)) s -= 15;
  if (/latest/.test(n)) s += 35;
  return s;
}
function sortModels(names) { return [...names].sort((a, b) => modelScore(b) - modelScore(a)); }

async function resolveModel() {
  const best = sortModels(await listModels())[0];
  if (!best) throw new Error("このAPIキーで使えるGeminiのモデルが見つかりませんでした");
  SET.model = best;
  saveSettings();
  return best;
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// モデルを替えればうまくいくかもしれないエラー（廃止・混雑・そのモデルの無料枠切れ）
const SWITCHABLE = [404, 429, 500, 503];

async function callModel(model, system, prompt, schema) {
  let res;
  try {
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": SET.apiKey },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: system }] },
        contents: [{ role: "user", parts: [{ text: prompt }] }],
        generationConfig: { responseMimeType: "application/json", responseSchema: toGeminiSchema(schema), temperature: 1.0 },
      }),
    });
  } catch (e) {
    throw new Error("通信できませんでした。電波を確認してね");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = data.error?.message ?? "";
    let text = `Geminiエラー ${res.status}: ${msg}`;
    if (res.status === 429) text = "無料枠の回数制限です。1〜2分待ってもう一度（1日の上限なら明日）";
    else if (res.status === 400 && /API key/i.test(msg)) text = "APIキーが正しくないみたい";
    else if (res.status === 404) text = `モデル「${model}」が見つかりません（設定で変更してね）`;
    else if (res.status === 503 || res.status === 500) text = "Geminiが混み合っています。少し待ってもう一度";
    throw Object.assign(new Error(text), { status: res.status });
  }
  const cand = data.candidates?.[0];
  const text = (cand?.content?.parts ?? []).filter((p) => !p.thought && p.text).map((p) => p.text).join("");
  if (!text) throw new Error("AIが投稿を書けませんでした（内容がブロックされたかも）。方針を変えてもう一度");
  try {
    return JSON.parse(text.replace(/^```(?:json)?\s*|\s*```$/g, ""));
  } catch {
    throw new Error("AIの返事を読み取れませんでした。もう一度試してね");
  }
}

async function gemini(system, prompt, schema) {
  if (!SET.apiKey) throw new Error("APIキーが設定されていません（自分タブ→設定）");
  const model = !SET.model || SET.model === "auto" ? await resolveModel() : SET.model;
  let first;
  try {
    return await callModel(model, system, prompt, schema);
  } catch (e) {
    if (!SWITCHABLE.includes(e.status)) throw e;
    first = e;
  }
  // 混雑ならちょっと待って同じモデルでもう1回
  if (first.status === 503 || first.status === 500) {
    await sleep(2000);
    try {
      return await callModel(model, system, prompt, schema);
    } catch (e) {
      if (!SWITCHABLE.includes(e.status)) throw e;
    }
  }
  // ほかのモデルを順番に試す
  let others = [];
  try {
    others = sortModels(await listModels()).filter((n) => n !== model).slice(0, 4);
  } catch {
    throw first;
  }
  for (const m of others) {
    try {
      const r = await callModel(m, system, prompt, schema);
      SET.model = m;
      saveSettings();
      toast(`${model} がダメだったので ${m} に切り替えました`);
      return r;
    } catch (e) {
      if (!SWITCHABLE.includes(e.status)) throw e;
    }
  }
  throw first;
}

/* ================= 1日の投稿 ================= */
const STR = { type: "string" };
const INT = { type: "integer" };
const COMMENT_LIST = { type: "array", items: { type: "object", properties: { name: STR, text: STR }, required: ["name", "text"] } };

function buildPostRequest({ theme, tone, memo, wantOffer }) {

  const system = [
    "あなたは日本のSNS（X風）を舞台にしたシミュレーションゲームの進行役です。",
    "登場人物になりきって、リアルで生き生きとした日本語のSNS投稿やコメントを書きます。",

  ].join("\n");

  const prompt = `## 主人公（プレイヤーが育てているインフルエンサー）
名前: ${me.name} (@${me.handle})
ジャンル: ${me.genre}
性格・口調: ${me.persona}
フォロワー: ${fmt(S.followers)} / 好感度: ${S.image}/100 / 今日の体調: ${mood}
${flameNote}
最近の投稿:
${recent}

## 今日は ${S.day}日目（全${LAST_DAY}日）
今日のトレンド: ${S.trends.join(" ")}
プロデューサーの方針:
- テーマ: ${theme}
- トーン: ${toneInfo.label}（${toneInfo.desc}）
${memo ? `- ひとこと指示: ${memo}` : ""}
${S.pendingPR ? `- これは企業案件のPR投稿。「${S.pendingPR.brand}」の「${S.pendingPR.product}」を紹介する。#PR をつける。` : ""}

## ライバルたち
${rivals}

## 書いてほしいもの（JSON）
- post: 主人公の今日の投稿。主人公の性格・口調・体調を反映し、方針に沿って書く
- buzz: この投稿のバズりやすさ 0〜100。辛口に採点。ありきたりなら30前後、トレンドとジャンルと個性が噛み合って面白ければ70以上、伝説級のみ90以上${S.flame > 0 ? "。炎上中なので厳しめに" : ""}
- risk: 炎上リスク 0〜100（まじめなら低い、攻めた内容ほど高い）
- review: 投稿へのプロデューサー目線の短い講評（40字以内・関西弁の敏腕マネージャー風）
- comments: 投稿についた好意的〜ふつうのコメント3〜4件（name はそれっぽいユーザー名）
- flameComments: もし炎上した場合のきびしいコメント3件（ゲームとして笑える範囲で）
- rivalPosts: ライバル4人それぞれの今日の投稿。handle はライバルの handle をそのまま。buzz も0〜100で
- trends: 明日のトレンドになりそうなハッシュタグ3つ（季節感や今日の流れを反映）
${wantOffer ? "- offer: 主人公に来た企業案件。brand（架空の会社名）、product（商品）、pay（報酬の円。フォロワー数に見合った額）、fit（主人公のジャンル・キャラとの相性 0〜100。合わない案件も混ぜる）" : ""}`;

  const props = {
    post: STR, buzz: INT, risk: INT, review: STR,
    comments: COMMENT_LIST, flameComments: COMMENT_LIST,

    trends: { type: "array", items: STR },
  };
  const required = Object.keys(props);
  if (wantOffer) {
    props.offer = { type: "object", properties: { brand: STR, product: STR, pay: INT, fit: INT }, required: ["brand", "product", "pay", "fit"] };
    required.push("offer");
  }
  return { system, prompt, schema: { type: "object", properties: props, required } };
}

// フォロワーの増え方（バズり度がものを言う）
function calcGain(buzz) {
  const f = S.followers;
  const base = f * 0.14 + 60;
  let mult = Math.pow(buzz / 55, 2.2);
  if (buzz >= 88) mult *= 3.5;                 // 大バズ
  const imageFactor = 0.6 + (S.image / 100) * 0.8;
  return Math.round(base * mult * imageFactor * rand(0.75, 1.3));
}

async function doPost(theme, tone, memo) {
  if (busy) return;
  busy = true;
  showLoading("投稿を考えています…");
  const wantOffer = !S.pendingPR && !S.offer && S.followers >= 400 && Math.random() < 0.35;
  let r;
  try {
    const req = buildPostRequest({ theme, tone, memo, wantOffer });
    r = await gemini(req.system, req.prompt, req.schema);
  } catch (e) {
    busy = false;
    closeSheet();
    toast(e.message);
    return;
  }

  const day = S.day;
  const before = S.followers;
  const isPR = Boolean(S.pendingPR);
  let buzz = clamp(Math.round(Number(r.buzz) || 30) + buzzBonus() - (S.flame > 0 ? 10 : 0), 0, 100);
  if (S.energy < 40) buzz = Math.max(0, buzz - 5);
  if (isPR) buzz = Math.max(0, buzz - 8);       // PR投稿はちょっとウケにくい
  const risk = clamp(Number(r.risk) || 0, 0, 100);
  const flamed = Math.random() < Math.pow(risk / 100, 2);

  let delta;
  let comments = r.comments || [];
  if (flamed) {
    delta = -Math.round(S.followers * rand(0.06, 0.18));
    S.flame = clamp(S.flame + 40 + Math.round(risk / 3), 0, 100);
    S.image = clamp(S.image - 15, 0, 100);
    comments = (r.flameComments || []).map((c) => ({ ...c, bad: true }));
    buzz = Math.max(buzz, 60);                  // 悪い意味で注目は集まる
  } else {
    delta = calcGain(buzz);
    if (tone === "safe") S.image = clamp(S.image + 2, 0, 100);
    if (buzz >= 70) S.image = clamp(S.image + 1, 0, 100);
  }
  if (isPR) {
    S.image = clamp(S.image + (S.pendingPR.fit >= 60 ? 2 : -8), 0, 100);
    S.pendingPR = null;
  }
  S.followers = Math.max(10, S.followers + delta);
  S.energy = clamp(S.energy - POST_ENERGY, 0, 100);
  const adIncome = Math.round(S.followers / 1000) * 120;
  S.money += adIncome;

  const likes = Math.round(Math.max(3, before * (buzz / 100) * rand(0.05, 0.15) + Math.max(0, delta) * 0.6));
  S.timeline.unshift({
    id: S.seq++, type: "post", author: "me", day, text: String(r.post || "").slice(0, 400),
    buzz, likes, rts: Math.round(likes * rand(0.08, 0.3) * (buzz / 60)), comments: comments.slice(0, 4),
    review: r.review, flamed, pr: isPR,
  });

  // ライバルの投稿
  for (const rp of r.rivalPosts || []) {
    const rv = S.rivals.find((x) => x.handle === String(rp.handle).replace(/^@/, ""));
    if (!rv) continue;
    const b = clamp(Number(rp.buzz) || 40, 0, 100);
    const g = Math.round(rv.followers * rand(0.01, 0.035) * Math.pow(b / 50, 1.6));
    rv.followers += g;
    S.timeline.unshift({
      id: S.seq++, type: "post", author: rv.handle, day, text: String(rp.text || "").slice(0, 400), buzz: b,
      likes: Math.round(rv.followers * (b / 100) * rand(0.03, 0.08)), rts: Math.round(rv.followers * (b / 100) * rand(0.005, 0.02)), comments: [],
    });
  }
  if (Array.isArray(r.trends) && r.trends.length) S.trends = r.trends.slice(0, 3).map((t) => (String(t).startsWith("#") ? t : "#" + t));
  if (wantOffer && r.offer?.brand) S.offer = { ...r.offer, pay: Math.max(500, Math.round(Number(r.offer.pay) || 3000)), fit: clamp(Number(r.offer.fit) || 50, 0, 100) };
  trimTimeline();

  endDay();
  busy = false;
  showResult({ buzz, delta, flamed, adIncome, review: r.review });
}

async function doApology(memo) {
  if (busy) return;
  busy = true;
  showLoading("謝罪文を考えています…");
  const me = S.me;
  const lastFlame = S.timeline.find((p) => p.author === "me" && p.flamed);
  const system = "あなたは日本のSNSシミュレーションゲームの進行役です。キャラになりきって投稿を書き、世間の反応を判定します。";
  const prompt = `インフルエンサー ${me.name}（${me.genre}系、性格: ${me.persona}）が炎上中（炎上度${S.flame}/100）。
炎上した投稿: ${lastFlame?.text ?? "（不明）"}
プロデューサーからの指示: ${memo || "誠実に謝る"}

JSONで返して:
- post: キャラの口調を残しつつの謝罪投稿（140字以内）
- sincerity: 世間から見た誠実さ 0〜100（言い訳がましい・逆ギレなら低い）
- comments: 謝罪へのコメント3件（誠実さに応じて反応を変える）
- review: マネージャー（関西弁）の一言講評（40字以内）`;
  const schema = { type: "object", properties: { post: STR, sincerity: INT, comments: COMMENT_LIST, review: STR }, required: ["post", "sincerity", "comments", "review"] };
  let r;
  try {
    r = await gemini(system, prompt, schema);
  } catch (e) {
    busy = false;
    closeSheet();
    toast(e.message);
    return;
  }
  const sin = clamp(Number(r.sincerity) || 40, 0, 100);
  const day = S.day;
  const flameBefore = S.flame;
  S.flame = clamp(Math.round(S.flame - sin * 0.9), 0, 100);
  S.image = clamp(S.image + Math.round((sin - 45) / 4), 0, 100);
  const delta = sin >= 70 ? Math.round(S.followers * 0.02) : sin < 35 ? -Math.round(S.followers * 0.05) : 0;
  S.followers = Math.max(10, S.followers + delta);
  S.energy = clamp(S.energy - 15, 0, 100);
  S.timeline.unshift({
    id: S.seq++, type: "post", author: "me", day, text: String(r.post || ""), buzz: sin, likes: Math.round(S.followers * 0.01),
    rts: 0, comments: (r.comments || []).slice(0, 3).map((c) => ({ ...c, bad: sin < 40 })), review: r.review, apology: true,
  });
  endDay();
  busy = false;
  openSheet(`
    <div class="big-emoji">${sin >= 70 ? "🙏✨" : sin >= 40 ? "😐" : "💥"}</div>
    <h2 style="text-align:center">謝罪の結果：誠実さ ${sin}</h2>
    <p class="note">炎上度 ${flameBefore} → ${S.flame}</p>
    <div class="result-num ${delta >= 0 ? "up" : "down"}">${delta >= 0 ? "+" : ""}${fmt(delta)}</div>
    <div class="review">💬 ${esc(r.review)}</div>
    <button class="btn main block" style="margin-top:14px" onclick="closeSheet()">OK</button>`);
}

/* ================= 1日の終わり ================= */
function endDay() {
  if (S.flame > 0) S.flame = clamp(S.flame - 12, 0, 100);   // 炎上は時間でも冷める
  S.history.push({ day: S.day, followers: S.followers });
  if (S.day >= LAST_DAY) {
    S.ended = true;
  } else {
    S.day += 1;
  }
  save();
  render();
}

function rivalsIdle() {
  for (const rv of S.rivals) rv.followers += Math.round(rv.followers * rand(0.008, 0.025));
}

function doRest() {
  if (busy) return;
  S.energy = clamp(S.energy + REST_ENERGY, 0, 100);
  rivalsIdle();
  addNote(`${S.day}日目：${S.me.name} はゆっくり休みました 😴 元気+${REST_ENERGY}`);
  endDay();
  toast(`元気が回復した！（${S.energy}）`);

}

}

function buy(id) {
  const it = SHOP.find((x) => x.id === id);
  if (!it || S.money < it.price) return;
  S.money -= it.price;
  if (it.once) S.gear.push(id);
  if (id === "drink") S.energy = clamp(S.energy + 40, 0, 100);
  if (id === "ad") {
    const g = Math.round(S.followers * 0.08 + 300);
    S.followers += g;
    S.image = clamp(S.image - 3, 0, 100);
    toast(`フォロワー +${fmt(g)}`);
  }
  if (id === "trip") {
    S.flame = 0;
    S.image = clamp(S.image + 15, 0, 100);
    S.energy = 100;
    rivalsIdle();
    addNote(`${S.day}日目：${S.me.name} は旅行でリフレッシュ 🏝️`);
    closeSheet();
    endDay();
    toast("心も体もリフレッシュ！");
    if (S.ended) showEnding();
    return;
  }
  if (it.once) toast(`${it.name} を手に入れた！`);
  if (id === "drink") toast(`元気 ${S.energy}`);
  save();
  render();
  openShop();
}

/* ----- 設定 ----- */
function openSettings() {
  openSheet(`
    <h2>⚙️ 設定</h2>
    <label class="f">GeminiのAPIキー</label>
    <input id="st-key" class="in" value="${esc(SET.apiKey)}" placeholder="AIza..." autocomplete="off">
    <p class="hint"><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> で無料で発行できます</p>
    <label class="f">モデル</label>
    <input id="st-model" class="in" value="${esc(SET.model)}" placeholder="auto">
    <p class="hint">「auto」にすると、使えるモデルから自動で選びます。回数制限に引っかかりやすいときは名前に「lite」がつくモデルにしてみてね</p>
    <button class="btn block" id="st-list">🔍 使えるモデルを調べる</button>
    <div class="chips" id="st-models" style="margin-top:8px"></div>
    <button class="btn main block" style="margin-top:12px" id="st-save">保存</button>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
    <button class="btn danger block" id="st-reset">データを消して最初から</button>
    <p class="note"><a href="index.html">配信ゲーム「今夜も配信中」へ</a></p>`);
  $("st-save").onclick = () => {
    SET.apiKey = $("st-key").value.trim();
    SET.model = $("st-model").value.trim() || "auto";
    saveSettings();
    closeSheet();
    toast("保存しました");
  };
  $("st-list").onclick = async () => {
    const key = $("st-key").value.trim();
    if (!key) return toast("先にAPIキーを入れてね");
    SET.apiKey = key;
    $("st-models").innerHTML = '<span class="hint">調べています…</span>';
    try {
      const names = sortModels(await listModels());
      $("st-models").innerHTML = names.length
        ? names.map((n) => `<button class="chip" data-m="${esc(n)}">${esc(n)}</button>`).join("")
        : '<span class="hint">使えるモデルがありませんでした</span>';
      $("st-models").querySelectorAll(".chip").forEach((b) => b.onclick = () => {
        $("st-model").value = b.dataset.m;
        $("st-models").querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x === b));
      });
    } catch (e) {
      $("st-models").innerHTML = `<span class="hint">${esc(e.message)}</span>`;
    }
  };
  $("st-reset").onclick = () => {
    if (!confirm("今のゲームを消して、キャラ作りからやり直しますか？")) return;
    localStorage.removeItem(SAVE_KEY);
    S = null;
    closeSheet();
    showSetup();
  };
}

/* ----- エンディング ----- */
function ranking() {
  return [{ name: S.me.name, handle: S.me.handle, avatar: S.me.avatar, followers: S.followers, me: true }, ...S.rivals]
    .sort((a, b) => b.followers - a.followers);
}
function titleFor(f) {
  if (f >= 1000000) return "👑 伝説のインフルエンサー";
  if (f >= 100000) return "🌟 トップインフルエンサー";
  if (f >= 10000) return "✨ 人気インフルエンサー";
  if (f >= 1000) return "🌱 駆け出しインフルエンサー";
  return "🙂 ふつうの人";
}
function showEnding() {
  const list = ranking();
  const place = list.findIndex((x) => x.me) + 1;
  openSheet(`
    <span id="ending-shown"></span>
    <div class="big-emoji">${place === 1 ? "🏆" : "🎬"}</div>
    <h2 style="text-align:center">${LAST_DAY}日間おつかれさま！</h2>
    <p style="text-align:center;font-size:20px;font-weight:900;margin:6px 0">${titleFor(S.followers)}</p>
    <p class="note">最終フォロワー ${fmt(S.followers)} ・ ランキング ${place}位</p>
    <div class="card" style="box-shadow:none;border:1.5px solid var(--line)">${rankRows(list)}</div>
    <div class="btn-row">
      <button class="btn block" onclick="closeSheetOnly()">ふりかえる</button>
      <button class="btn main block" onclick="replay()">同じキャラでもう一度</button>
    </div>
    <button class="btn block" style="margin-top:8px" onclick="localStorage.removeItem(SAVE_KEY);S=null;closeSheetOnly();showSetup()">新しいキャラで遊ぶ</button>`);
}
function closeSheetOnly() { $("sheet-root").innerHTML = ""; }
function replay() {
  const me = S.me;
  newGame(me);
  closeSheetOnly();
  render();
}

/* ================= 描画 ================= */
function rankRows(list) {
  return list.map((x, i) => `<div class="rank-row ${x.me ? "me" : ""}">
    <div class="rank-no">${i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1}</div>
    <div class="avatar">${esc(x.avatar)}</div>
    <div><div class="name">${esc(x.name)}${x.me ? '<span class="me-tag">あなた</span>' : ""}</div><div class="handle">@${esc(x.handle)}</div></div>
    <div class="rank-f">${fmt(x.followers)}</div></div>`).join("");
}

function authorOf(p) {
  if (p.author === "me") return { name: S.me.name, handle: S.me.handle, avatar: S.me.avatar, me: true };
  return S.rivals.find((r) => r.handle === p.author) || { name: "?", handle: p.author, avatar: "👤" };
}

function postHtml(p) {
  if (p.type === "note") return `<div class="note">${esc(p.text)}</div>`;
  const a = authorOf(p);
  const fire = p.flamed ? " flame-card" : "";
  return `<div class="card${fire}">
    <div class="post-head">
      <div class="avatar">${esc(a.avatar)}</div>
      <div><div class="name">${esc(a.name)}${a.me ? '<span class="me-tag">あなた</span>' : ""}${p.pr ? '<span class="pr-tag">PR</span>' : ""}${p.apology ? '<span class="pr-tag" style="background:var(--muted)">謝罪</span>' : ""}</div>
      <div class="handle">@${esc(a.handle)} ・ ${p.day}日目</div></div>
    </div>
    <div class="post-text">${esc(p.text)}</div>
    <div class="post-meta"><span>♥ ${fmt(p.likes)}</span><span>🔁 ${fmt(p.rts)}</span>
      <span class="buzz">${p.flamed ? "🔥 炎上" : p.apology ? `誠実さ ${p.buzz}` : `バズ ${p.buzz}`}</span></div>
    ${p.comments?.length ? `<div class="comments">${p.comments.map((c) => `<div class="comment ${c.bad ? "bad" : ""}"><b>${esc(c.name)}</b>${esc(c.text)}</div>`).join("")}</div>` : ""}
  </div>`;
}

function chartSvg() {
  const h = S.history;
  if (h.length < 2) return `<p class="hint">投稿するとグラフが出ます</p>`;
  const W = 320, H = 120, pad = 6;
  const max = Math.max(...h.map((x) => x.followers));
  const min = Math.min(...h.map((x) => x.followers));
  const xs = (i) => pad + (i / (h.length - 1)) * (W - pad * 2);
  const ys = (v) => H - pad - ((v - min) / Math.max(1, max - min)) * (H - pad * 2);
  const pts = h.map((x, i) => `${xs(i).toFixed(1)},${ys(x.followers).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="フォロワーの推移">
    <polyline points="${pts}" fill="none" stroke="var(--pink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </svg><div class="hint" style="display:flex;justify-content:space-between"><span>${fmt(min)}</span><span>最高 ${fmt(max)}</span></div>`;
}

function render() {
  if (!S) return;
  $("h-name").textContent = `${S.me.avatar} ${S.me.name}`;
  $("h-day").textContent = S.ended ? "シーズン終了" : `${S.day} / ${LAST_DAY}日目`;
  $("h-fol").textContent = fmt(S.followers);
  $("h-energy").textContent = S.energy;
  $("h-energy-bar").style.width = S.energy + "%";
  $("h-image").textContent = S.image;
  $("h-image-bar").style.width = S.image + "%";
  $("h-money").textContent = fmt(S.money);
  $("trend-line").innerHTML = S.pendingPR ? `📩 次の投稿は <b>${esc(S.pendingPR.brand)}</b> のPR`
    : S.flame > 0 ? `🔥 炎上中（${S.flame}）— 投稿画面から謝罪できます`
    : `トレンド：${S.trends.map((t) => `<b>${esc(t)}</b>`).join(" ")}`;
  $("a-post").disabled = S.ended;
  $("a-rest").disabled = S.ended;
  $("a-post").textContent = S.ended ? "🏁 結果を見る" : S.energy < POST_ENERGY ? "😵 元気が足りない" : "✍️ 今日の投稿";
  if (S.ended) $("a-post").disabled = false;

  $("v-tl").innerHTML = S.timeline.map(postHtml).join("") || `<p class="note">まだ投稿がありません</p>`;
  $("v-rank").innerHTML = `<div class="card">${rankRows(ranking())}</div>
    <p class="hint">ライバルも毎日投稿してフォロワーを増やしています。${LAST_DAY}日目の終わりに1位を目指そう！</p>`;
  $("v-me").innerHTML = `
    <div class="card">
      <div class="post-head"><div class="avatar">${esc(S.me.avatar)}</div>
        <div><div class="name">${esc(S.me.name)}</div><div class="handle">@${esc(S.me.handle)} ・ ${esc(S.me.genre)}</div></div></div>
      <p style="margin:8px 0 0;font-size:14px">${esc(S.me.persona)}</p>
      <p class="hint" style="margin:6px 0 0">称号：${titleFor(S.followers)}</p>
    </div>
    <div class="card"><b>フォロワーの推移</b>${chartSvg()}</div>
    <div class="card">
      <b>持ち物</b>
      <p style="margin:6px 0 0">${S.gear.length ? S.gear.map((g) => { const it = SHOP.find((x) => x.id === g); return `${it.ico} ${it.name}`; }).join("<br>") : '<span class="hint">なし</span>'}</p>
      ${S.flame > 0 ? `<p style="margin:8px 0 0">🔥 炎上度 ${S.flame}</p>` : ""}
    </div>
    <button class="btn block" onclick="openSettings()">⚙️ 設定（APIキー・リセット）</button>`;
}

/* ================= キャラ作り ================= */
function showSetup() {
  $("game").classList.add("hidden");
  $("setup").classList.remove("hidden");
  let avatar = AVATARS[0];
  let genre = GENRES[0];
  $("s-key").value = SET.apiKey;
  const known = [...$("s-model").options].map((o) => o.value);
  if (known.includes(SET.model)) $("s-model").value = SET.model;
  else { $("s-model").value = "custom"; $("s-model-custom").classList.remove("hidden"); $("s-model-custom").value = SET.model; }
  $("s-model").onchange = () => $("s-model-custom").classList.toggle("hidden", $("s-model").value !== "custom");

  $("s-avatars").innerHTML = AVATARS.map((a) => `<button class="chip emoji-chip ${a === avatar ? "on" : ""}" data-v="${a}">${a}</button>`).join("");
  $("s-genres").innerHTML = GENRES.map((g) => `<button class="chip ${g === genre ? "on" : ""}" data-v="${g}">${g}</button>`).join("");
  const bindChips = (box, set) => box.querySelectorAll(".chip").forEach((b) => b.onclick = () => {
    set(b.dataset.v);
    box.querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x === b));
  });
  bindChips($("s-avatars"), (v) => { avatar = v; });
  bindChips($("s-genres"), (v) => { genre = v; });

  $("s-start").onclick = () => {
    const key = $("s-key").value.trim();
    const model = $("s-model").value === "custom" ? $("s-model-custom").value.trim() : $("s-model").value;
    const name = $("s-name").value.trim();
    const handle = $("s-handle").value.trim().replace(/^@/, "").replace(/[^\w]/g, "") || "my_influencer";
    const persona = $("s-persona").value.trim();
    if (!key) return toast("APIキーを入れてね");
    if (!name) return toast("名前を入れてね");
    if (!persona) return toast("性格・口調を入れてね");
    SET.apiKey = key;
    SET.model = model || "auto";
    saveSettings();
    newGame({ name, handle, avatar, genre, persona });
    showGame();
  };
}

function showGame() {
  $("setup").classList.add("hidden");
  $("game").classList.remove("hidden");
  window.scrollTo(0, 0);
  render();
}

/* ================= 起動 ================= */
document.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
  for (const v of ["tl", "rank", "me"]) $("v-" + v).classList.toggle("hidden", v !== t.dataset.tab);
});
$("a-post").onclick = () => (S.ended ? showEnding() : openCompose());
$("a-rest").onclick = doRest;
$("a-shop").onclick = openShop;

loadAll();
if (S && S.me) showGame();
else showSetup();
</script>
